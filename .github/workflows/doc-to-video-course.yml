name: Test doc-to-video-course

on:
  push:
    paths:
      - 'doc-to-video-course/**'
      - '.github/workflows/doc-to-video-course.yml'
  pull_request:
    paths:
      - 'doc-to-video-course/**'
      - '.github/workflows/doc-to-video-course.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: '3.13'
          enable-cache: false
      - name: Install Chromium and Linux system libraries
        if: runner.os == 'Linux'
        run: uv run --with playwright playwright install --with-deps --only-shell chromium
      - name: Install Chromium
        if: runner.os != 'Linux'
        run: uv run --with playwright playwright install --only-shell chromium
      - name: Run regression tests
        run: uv run --with playwright --with edge-tts --with imageio-ffmpeg python -m unittest discover -v -s doc-to-video-course/tests
